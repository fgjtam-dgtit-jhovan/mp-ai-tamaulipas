services:

  # ── Base de datos relacional ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mpia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mpia_tamaulipas}
      POSTGRES_USER: ${POSTGRES_USER:-mpia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Búsqueda semántica (RAG jurídico y RAG de hechos) ───────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mpia_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Caché ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mpia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Almacenamiento de archivos (evidencia, documentos) ──────────
  minio:
    image: minio/minio:latest
    container_name: mpia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mpia_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data

  # ── Modelo de lenguaje ejecutado localmente ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mpia_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Si tienes GPU NVIDIA disponible, descomenta lo siguiente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Servicio de IA / RAG (Python + FastAPI) ─────────────────────
  # No expuesto al navegador: solo Laravel lo consume (ver README).
  ai-service:
    build: ./ai-service
    container_name: mpia_ai_service
    restart: unless-stopped
    env_file: .env
    environment:
      AI_DB_HOST: postgres
      AI_DB_PORT: 5432
      AI_DB_DATABASE: ${POSTGRES_DB:-mpia_tamaulipas}
      AI_DB_USERNAME: ${POSTGRES_USER:-mpia}
      AI_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - qdrant
      - ollama
    volumes:
      - ./ai-service:/app

  # ── Backend (Laravel 13 + Vue Starter Kit + Inertia 3) ───────────
  # El frontend NO va en carpeta/contenedor aparte: vive dentro de
  # backend/resources/js/ (lo crea el starter kit automáticamente).
  # En desarrollo se recomienda correr esto NATIVO (composer run dev)
  # para conservar el hot-reload de Vite — ver README. Descomenta este
  # bloque solo cuando muevas el backend a Docker (ej. producción).
  # backend:
  #   build: ./backend
  #   container_name: mpia_backend
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #     - redis
  #     - minio
  #     - ai-service
  #   volumes:
  #     - ./backend:/var/www/html

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  ollama_data:
