services:

  postgres:
    image: postgres:16-alpine
    container_name: mpia_postgres_dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mpia_tamaulipas}
      POSTGRES_USER: ${POSTGRES_USER:-mpia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mpia} -d ${POSTGRES_DB:-mpia_tamaulipas}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: mpia_redis_dev
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data_dev:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  qdrant:
    image: qdrant/qdrant:latest
    container_name: mpia_qdrant_dev
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data_dev:/qdrant/storage


  minio:
    image: minio/minio:latest
    container_name: mpia_minio_dev
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mpia_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme123}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data_dev:/data


  ollama:
    image: ollama/ollama:latest
    container_name: mpia_ollama_dev
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data_dev:/root/.ollama


  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: mpia_ai_service_dev
    restart: unless-stopped

    env_file:
      - .env

    environment:
      AI_DB_HOST: postgres
      AI_DB_PORT: 5432
      AI_DB_DATABASE: ${POSTGRES_DB:-mpia_tamaulipas}
      AI_DB_USERNAME: ${POSTGRES_USER:-mpia}
      AI_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434

    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      ollama:
        condition: service_started

    volumes:
      - ./ai-service:/app


volumes:

  postgres_data_dev:
  redis_data_dev:
  qdrant_data_dev:
  minio_data_dev:
  ollama_data_dev: